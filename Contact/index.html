<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Nayara Watanuki</title>

    <link rel="stylesheet" href="../style/index.css">
    <link rel="stylesheet" href="./style.css">

    <script
        src="https://kit.fontawesome.com/3aed3665a4.js"
        crossorigin="anonymous">
    </script>
</head>

<body>
    <header class="header">
        <nav class="menu" aria-label="Navegação principal">
            <ul class="menu-list">
                <li class="menu-inline">
                    <a class="menu-link" href="../index.html">
                        Home
                    </a>
                </li>

                <li class="menu-inline">
                    <a class="menu-link" href="../CV/index.html">
                        CV
                    </a>
                </li>

                <li class="menu-inline">
                    <a
                        class="menu-link active"
                        href="./index.html"
                        aria-current="page">
                        Contatos
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="card" aria-labelledby="contact-title">
            <h1
                class="contact-title"
                id="professional-name">
            </h1>

            <p
                class="contact-role"
                id="professional-role">
            </p>

            <address class="contact-links">
                <a
                    href="https://goo.gl/maps/3Apsn7QNzkQ4NkHa8"
                    aria-label="Endereço">
                    <i
                        class="fas fa-map-marker-alt icons icons-contact"
                        aria-hidden="true">
                    </i>
                </a>

                <a
                    href="mailto:nayarawatanuki@gmail.com"
                    aria-label="E-mail">
                    <i
                        class="fas fa-envelope-square icons icons-contact"
                        aria-hidden="true">
                    </i>
                </a>

                <a
                    href="https://wa.me/message/OUBVPKV34I7KO1"
                    aria-label="WhatsApp">
                    <i
                        class="fab fa-whatsapp-square icons icons-contact"
                        aria-hidden="true">
                    </i>
                </a>

                <a
                    href="https://www.linkedin.com/in/nayarawatanuki/"
                    aria-label="LinkedIn">
                    <i
                        class="fab fa-linkedin icons icons-contact"
                        aria-hidden="true">
                    </i>
                </a>

                <a
                    href="https://github.com/nayarawatanuki"
                    aria-label="GitHub">
                    <i
                        class="fab fa-github-square icons icons-contact"
                        aria-hidden="true">
                    </i>
                </a>
            </address>
        </section>
    </main>

    <script src="../js/data.js"></script>
</body>
</html>
